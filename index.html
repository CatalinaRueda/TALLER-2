<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Streaming Dashboard</title>
    <style>
        .card {
    border: 1px solid #ccc;
    padding: 10px;
    margin: 10px;
    border-radius: 5px;
    width: 250px;
}

.watched {
    background-color: #d4edda;
    border-color: #28a745;
}

.not-watched {
    background-color: #f8f9fa;
}

button {
    margin-top: 10px;
    padding: 5px 10px;
    cursor: pointer;
}

#movies-container {
    display: flex;
    flex-wrap: wrap;
}

.status {
    font-weight: bold;
}
    </style>
   
</head>

<body>
    <h1>Mis Películas</h1>
    <div id="movies-container"></div>
    <script src="js/main.js"></script>
</body>
</html>
